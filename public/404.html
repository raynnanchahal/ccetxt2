<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;

        // IMPORTANT: MUST MATCH YOUR REPO NAME
        var redirect =
          "/ccetxt2/" +
          "?p=" +
          encodeURIComponent(l.pathname + l.search + l.hash);

        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>Redirecting…</body>
</html>
