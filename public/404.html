<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;

        // For root-domain GitHub Pages, do NOT prefix anything.
        // Just pass the original path as ?p=<path>.
        var redirect =
          "/?p=" + encodeURIComponent(l.pathname + l.search + l.hash);

        window.location.replace(redirect);
      })();
    </script>
  </head>
  <body>Redirecting…</body>
</html>
